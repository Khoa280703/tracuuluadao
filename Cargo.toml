[package]
name = "tracuuluadao"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "socks", "rustls-tls"] }
rquest = { version = "5.1.0", features = ["full"] }
rquest-util = { version = "2.2.1", default-features = false, features = ["emulation"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

scraper = "0.22"
regex = "1"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "macros"] }

async-stream = "0.3"
toml = "0.8"
notify = "7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.9"
sha2 = "0.10"
url = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1"
redis = { version = "0.27", features = ["tokio-comp"] }
