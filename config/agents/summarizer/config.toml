[model]
endpoint = "http://host.docker.internal:8001/v1/chat/completions"
name = ""
temperature = 0.2
max_tokens = 600
top_p = 0.9
enable_thinking = false

[response]
format = "json"
stream = false
schema = "output-schemas.json#summarizer"

[prompt]
system = "prompt.md"
include_shared = ["persona.md", "risk-levels.md"]
few_shot = "examples.json"

[runtime]
timeout_ms = 10000
retry_count = 1
