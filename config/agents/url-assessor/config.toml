[model]
endpoint = "http://host.docker.internal:8001/v1/chat/completions"
name = ""
temperature = 0.1
max_tokens = 900
top_p = 0.9
enable_thinking = false

[response]
format = "json"
stream = false
schema = "output-schemas.json#url_assessor"

[prompt]
system = "prompt.md"
include_shared = ["persona.md", "risk-levels.md"]
few_shot = "examples.json"

[runtime]
timeout_ms = 20000
retry_count = 1
