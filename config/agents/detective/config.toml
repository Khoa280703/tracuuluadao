[model]
endpoint = "http://host.docker.internal:8101/v1/chat/completions"
name = ""
temperature = 0.3
max_tokens = 1200
top_p = 0.9
enable_thinking = false

[response]
format = "markdown"
stream = true

[prompt]
system = "prompt.md"
include_shared = ["risk-levels.md"]
few_shot = "examples.json"

[runtime]
timeout_ms = 25000
retry_count = 1
