services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    expose:
      - "8080"
    volumes:
      - ./deploy/coolify/Caddyfile:/etc/caddy/Caddyfile:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3067"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3067
      DATABASE_URL: postgres://${POSTGRES_USER:-tracuuluadao}:${POSTGRES_PASSWORD:-tracuuluadao_dev_local}@postgres:5432/${POSTGRES_DB:-tracuuluadao}
      REDIS_URL: redis://redis:6379/
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      INVESTIGATION_REPORT_TTL_SECS: ${INVESTIGATION_REPORT_TTL_SECS:-3600}
      PROXY_DIR: /app/proxies
      AGENT_CONFIG_DIR: /app/config/agents
      RUST_LOG: ${RUST_LOG:-info}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15435}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracuuluadao}
      POSTGRES_USER: ${POSTGRES_USER:-tracuuluadao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracuuluadao_dev_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracuuluadao} -d ${POSTGRES_DB:-tracuuluadao}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
